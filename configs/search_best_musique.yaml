# Обученная state-башня линии A на MuSiQue-Ans dev — единственный из трёх
# датасетов, которого модель не видела при обучении.
#
# HotpotQA и 2Wiki in-domain: их train-сплиты и составили обучающую выборку.
# MuSiQue не участвовал ни в каком виде, поэтому эта строка меряет перенос, а
# не качество на знакомом распределении. Разница с zero-shot той же башни —
# то, что обучение дало на незнакомом датасете.
#
# Берётся musique_ans, а не musique_full: у full те же 2 417 вопросов
# продублированы неотвечаемыми двойниками, а ридер и судья отказ от ответа не
# предусматривают — промпты лежат в read-only Q-RAG-feedback.
