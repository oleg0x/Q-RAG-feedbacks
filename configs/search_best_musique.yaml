# Trained state tower of line A on MuSiQue-Ans dev, the only one of the three
# datasets the model did not see in training.
#
# HotpotQA and 2Wiki are in-domain (their train splits formed the training
# set); MuSiQue was not used in any form, so this row measures transfer rather
# than quality on a familiar distribution. The gap to zero-shot with the same
# tower is what training buys on an unseen dataset.
#
# musique_ans rather than musique_full: full duplicates the same 2,417
# questions with unanswerable twins, and the reader and judge prompts have no
# abstention option.
label: Direct search, trained tower, 6 steps, N=2
slug: lineA-best-musique
dataset: musique_ans_dev

order: 48
hypothesis: >-
  Training direct search transfers to an unseen dataset: the trained tower
  beats its zero-shot on MuSiQue as well. A much smaller gap than on HotpotQA
  and 2Wiki would mean the tower fits the training question distribution
  rather than learning search as such.

retrieve:
  kind: search
  index_dir: /path/to/data/full-wiki/wiki18-gte
  qrag_repo: Q-RAG_for_full-wiki
  checkpoint: Q-RAG_for_full-wiki/runs/Aug03_12-44-38_lineA_main/model_best.pt
  state_source: critic
  input: runs/shared/musique_ans_dev_hotpot_schema.jsonl
  cuda_visible_devices: "6"
  device: cuda:0
  model_dtype: float32
  batch_size: 64
  top_k: 100
  steps: 6
  max_chunks_per_title: 2
  log_candidates: full
  auto_prepare: false

judge:
  script: src/answer_judge.py
  contract: v1
  base_url: http://127.0.0.1:8010/v1
  answer_model: Qwen3-4B
  max_tokens: 1000
  judge_max_tokens: 100
  shards: 32
