# Trained state tower of line A on the full 2WikiMultiHopQA dev set.
#
# 2Wiki is in-domain: its train split, together with the HotpotQA train split,
# formed the training set (envs.train_data_path of run
# Aug03_12-44-38_lineA_main). There is no leakage: the overlap between the
# 120,631 training examples and this dev set, by id and by question text, is
# zero.
#
# Paired with search_zeroshot_2wiki.yaml on the same questions and budget. The
# corpus coverage ceiling is 51.05%, so absolute EM here and on HotpotQA is not
# comparable; the fraction of the ceiling is.
label: Direct search, trained tower, 6 steps, N=2
slug: lineA-best-2wiki
dataset: 2wiki_dev

order: 48
hypothesis: >-
  Training improves answer metrics on 2Wiki as it does on HotpotQA. The
  dataset is in-domain, but 22% of its questions require four distinct gold
  articles under a six-chunk budget with quota N=2, so the gain may be
  smaller.

retrieve:
  kind: search
  index_dir: /path/to/data/full-wiki/wiki18-gte
  qrag_repo: Q-RAG_for_full-wiki
  checkpoint: Q-RAG_for_full-wiki/runs/Aug03_12-44-38_lineA_main/model_best.pt
  state_source: critic
  input: /path/to/data/2WikiMultiHopQA/data_ids_april7/dev.json
  cuda_visible_devices: "6"
  device: cuda:0
  model_dtype: float32
  batch_size: 64
  top_k: 100
  steps: 6
  max_chunks_per_title: 2
  log_candidates: full
  auto_prepare: false

judge:
  script: src/answer_judge.py
  contract: v1
  base_url: http://127.0.0.1:8010/v1
  answer_model: Qwen3-4B
  max_tokens: 1000
  judge_max_tokens: 100
  shards: 32
