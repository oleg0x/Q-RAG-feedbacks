# 2Wiki — in-domain: его train-сплит вместе с train-сплитом HotpotQA и составил
# обучающую выборку (envs.train_data_path рана Aug03_12-44-38_lineA_main).
# Утечки при этом нет: пересечение 120 631 обучающего примера с этим dev по id
# и по тексту вопроса — ноль.
#
# Пара для чтения — search_zeroshot_2wiki.yaml на тех же вопросах и том же
# бюджете. Потолок покрытия корпуса 51.05%, поэтому абсолютный EM здесь и на
# HotpotQA несравним; сравнима доля потолка.
label: Прямой поиск, обученная башня, 6 шагов, N=2
slug: lineA-best-2wiki
dataset: 2wiki_dev

order: 48
hypothesis: >-
  Обучение поднимает answer-метрики на 2Wiki так же, как на HotpotQA: датасет
  in-domain, но 22% его вопросов требуют четырёх различных gold-статей при
  бюджете в шесть чанков и квоте N=2, поэтому выигрыш может оказаться меньше.

retrieve:
