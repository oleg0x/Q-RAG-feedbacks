# GTE top-2: the gte_only_steps6 run truncated to two chunks.
#
# No separate retrieval is needed: in fixed mode the candidate pool is fixed
# and GTE ranking does not depend on the state, so the 2-step selection is a
# prefix of the 6-step one. This does not hold for Q-RAG, where every hop
# reranks the pool, and build_eval_variants.py refuses to truncate such runs.
label: GTE top-2
slug: gte-only-steps2

# Row position in the results table.
order: 20
hypothesis: >-
  Plain first-stage GTE: the baseline against which the contribution of Q-RAG
  is measured.

retrieve:
  kind: variant
  context: truncate
  steps: 2
  source_run: 2026-07-28-gte-only-steps6

judge:
  script: src/answer_judge.py
  contract: v1
  base_url: http://127.0.0.1:8010/v1
  answer_model: Qwen3-4B
  max_tokens: 1000
  judge_max_tokens: 100
  shards: 32
