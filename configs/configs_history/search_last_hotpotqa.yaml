# Тот же эксперимент, что search_best_hotpotqa.yaml, но последним чекпоинтом.
#
# Вопрос ровно один: значил ли что-нибудь выбор model_best. Кривая eval с шага
# ~7 000 стоит на плато 0.484 ± 0.005 все оставшиеся 23 000 шагов, а
# model_best — пик 0.499 на шагах 12 500–13 000, то есть примерно одна сигма
# над плато при σ ≈ 1.6 п.п. на выборке в 1 000 вопросов. Если выбор по
# argmax шумной кривой ничего не решает, две строки совпадут в пределах
# нескольких десятых, и парный МакНемар это покажет.
#
# model_last.pt — это optim_step 29 500, а не 30 000: чекпоинт пишется на
# eval-точках с шагом 500, и последняя запись предшествует финальному шагу.
#
# Метка отличается от best-конфига словом «последний чекпоинт»: метки
# вмораживаются в манифест при запуске и служат ключами парного теста,
# поэтому переименовать уже сделанный ран задним числом нельзя.
label: Прямой поиск, последний чекпоинт, 6 шагов, N=2
