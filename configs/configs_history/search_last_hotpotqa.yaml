# Same experiment as search_best_hotpotqa.yaml, but with the last checkpoint.
#
# The only question: did selecting model_best matter? From step ~7,000 the eval
# curve stays on a plateau of 0.484 ± 0.005 for the remaining 23,000 steps,
# while model_best is the 0.499 peak at steps 12,500-13,000, about one sigma
# above the plateau (σ ≈ 1.6 pp on 1,000 questions). If argmax selection on a
# noisy curve decides nothing, the two rows will agree within a few tenths of a
# point, and paired McNemar will show it.
#
# model_last.pt is optim_step 29,500, not 30,000: checkpoints are written at
# eval points every 500 steps, and the last one precedes the final step.
#
# The label differs from the best config by "last checkpoint": labels are
# frozen into the run manifest at launch and serve as keys for the paired test.
label: Direct search, last checkpoint, 6 steps, N=2
slug: lineA-last-hotpotqa
dataset: hotpotqa_dev_fullwiki

order: 49
hypothesis: >-
  Selecting the checkpoint at the eval-curve peak gives no significant
  advantage over the last one: the best-last difference on the full dev set is
  within noise, and paired McNemar shows no consistent advantage.

retrieve:
  kind: search
  index_dir: /path/to/data/full-wiki/wiki18-gte
  qrag_repo: Q-RAG_for_full-wiki
  checkpoint: Q-RAG_for_full-wiki/runs/Aug03_12-44-38_lineA_main/model_last.pt
  state_source: critic
  input: /path/to/data/hotpotqa/hotpot_dev_fullwiki_v1.json
  cuda_visible_devices: "2"
  device: cuda:0
  model_dtype: float32
  batch_size: 64
  top_k: 100
  steps: 6
  max_chunks_per_title: 2
  log_candidates: full
  auto_prepare: false

judge:
  script: src/answer_judge.py
  contract: v1
  base_url: http://127.0.0.1:8010/v1
  answer_model: Qwen3-4B
  max_tokens: 1000
  judge_max_tokens: 100
  shards: 32
