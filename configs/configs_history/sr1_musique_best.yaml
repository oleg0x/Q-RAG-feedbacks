# MuSiQue из eval-таблицы Search-R1: обученная башня линии A.
#
# Мультихопный, out-of-domain у обеих сторон. Самый трудный из семи.
#
# Конфигурация ретривала — ровно та, что дала опубликованные 37.70/30.31/10.14
# на наших собственных dev-сплитах: шесть шагов, квота N=2, шесть чанков
# ридеру. Одна модель и одна настройка на все семь датасетов; подгонять бюджет
# под каждый значило бы настраивать на eval.
#
# Читается только вместе с двумя своими соседями на тех же вопросах:
# sr1_musique_zeroshot (та же башня без чекпоинта) и sr1_musique_noctx (ридер без
# контекста вообще). Без первого неизвестно, что дало обучение, без второго —
# сколько Qwen3-4B отвечает по памяти.
#
# Gold-титулов у этого входа нет, поэтому title-метрики и доля потолка
# остаются null. Главное число — EM по алиасам: Search-R1 считает EM
# максимумом по всему golden_answers.
label: Прямой поиск, обученная башня, 6 шагов, N=2
slug: sr1-best-musique
dataset: sr1_musique

order: 48
hypothesis: >-
  Обученная state-башня линии A на MuSiQue (2417 вопросов) обгоняет и свой
  zero-shot, и ридер без контекста; результат ставится рядом с
  Search-R1-base-7B на том же корпусе Wiki-18 и тех же вопросах.

