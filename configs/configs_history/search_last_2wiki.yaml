# Last checkpoint of line A on the full 2WikiMultiHopQA dev set.
#
# Paired with search_best_2wiki.yaml; see search_last_hotpotqa.yaml for the
# rationale. The same check on the second in-domain dataset: if the best-last
# gap on HotpotQA is noise, it should be noise here too, while a consistent
# advantage of one checkpoint on both datasets would mean the opposite.
label: Direct search, last checkpoint, 6 steps, N=2
slug: lineA-last-2wiki
dataset: 2wiki_dev

order: 49
hypothesis: >-
  The best-last difference on 2Wiki is within noise, as on HotpotQA.

retrieve:
  kind: search
  index_dir: /path/to/data/full-wiki/wiki18-gte
  qrag_repo: Q-RAG_for_full-wiki
  checkpoint: Q-RAG_for_full-wiki/runs/Aug03_12-44-38_lineA_main/model_last.pt
  state_source: critic
  input: /path/to/data/2WikiMultiHopQA/data_ids_april7/dev.json
  cuda_visible_devices: "2"
  device: cuda:0
  model_dtype: float32
  batch_size: 64
  top_k: 100
  steps: 6
  max_chunks_per_title: 2
  log_candidates: full
  auto_prepare: false

judge:
  script: src/answer_judge.py
  contract: v1
  base_url: http://127.0.0.1:8010/v1
  answer_model: Qwen3-4B
  max_tokens: 1000
  judge_max_tokens: 100
  shards: 32
