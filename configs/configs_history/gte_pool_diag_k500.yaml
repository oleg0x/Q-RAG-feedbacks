# The same diagnostic retrieval as gte_pool_diag.yaml, but with a pool five
# times wider: top-500 instead of top-100.
#
# For 50.50% of the examples where the first gold title is found, the second
# one is absent from top-100 altogether, and the median rank of the second gold
# title is 12 (p90 = 63). Question: is this fixed by pool size, or is the
# second hop unreachable for GTE in principle? It is answered by title EM@pool
# and second_missing_given_first_found at 100 → 500 → 1000.
#
# Why steps: 1. In fixed mode the pool is computed once and reused at every
# step, and candidate_pool.py report reads only
# retrieval_hops[0]["first_stage_candidate_idx"]; six steps would write the
# same pool six times, six times the disk for no new number. Chunk selection is
# not measured by this run, so the judge and score stages are not needed: run
# with `--only retrieve`.
label: GTE pool top-500 (diagnostics)
slug: gte-pool-diag-k500

# A run without metrics; it is excluded from the comparison table.
order: 901
hypothesis: >-
  Widening the pool from 100 to 500 candidates raises title EM@pool and
  reduces the fraction of examples whose second gold title does not reach the
  pool.

retrieve:
  kind: qrag
  index_dir: /path/to/data/full-wiki/wiki18-qrag-jul21-best-raw
  candidate_index_dir: /path/to/data/full-wiki/wiki18-gte
  candidate_backend: torch-cuda
  qrag_repo: /path/to/Q-RAG-feedback
  input: /path/to/data/hotpotqa/hotpot_dev_fullwiki_v1.json
  cuda_visible_devices: "1"
  device: cuda:0
  model_dtype: float32
  state_source: critic
  batch_size: 64

  # The only differences from gte_pool_diag.yaml.
  top_k: 500
  steps: 1

  mode: fixed
  reranker: none
  log_candidates: full

  dedupe_titles: true
  trust_remote_code: true
  auto_prepare: false

judge:
  script: src/answer_judge.py
  contract: v1
  base_url: http://127.0.0.1:8010/v1
  answer_model: Qwen3-4B
  max_tokens: 1000
  judge_max_tokens: 100
  shards: 32
