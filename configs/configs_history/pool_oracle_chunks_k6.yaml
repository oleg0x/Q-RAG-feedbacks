# Chunk-aware oracle: 6 chunks are taken from the same 100 GTE candidates, but
# the chunk of a gold title is chosen by content rather than rank: the chunk
# containing the gold sentence wins (whole > half > none), and GTE rank only
# breaks ties.
#
# Why separately from the title oracle: that one takes the best-ranked chunk of
# an article and thus understates the ceiling, since a chunk reranker could
# pick another chunk of the same title. Allowing any chunk of the article from
# the pool lowers the "sentence not in chunk" share from 40.7% to 26.7%. This
# row is the fair upper bound of a chunk reranker over top-100.
#
# It is still not the task ceiling: no selection can recover what is not in the
# pool, and half of the second gold titles do not make it into top-100.
#
# Title deduplication is kept (one chunk per article), as in the runs this row
# is compared with.
label: chunk oracle, 6 chunks
slug: pool-oracle-chunks-k6

order: 77
hypothesis: >-
  Choosing chunks by content rather than rank raises the reranking ceiling
  over top-100 relative to the title oracle: the gold sentence often lies
  outside the article's top-ranked GTE chunk.

retrieve:
  kind: pool
  source_run: 2026-08-02-gte-pool-diag

  # Corpus and offset table: pool row IDs are resolved to chunk texts with
  # the same table the retrieval used.
  index_dir: /path/to/data/full-wiki/wiki18-qrag-jul21-best-raw
  steps: 6

  # Difference from pool_oracle_titles_k6.yaml. Gold sentences exist only in
  # the distractor file: in the fullwiki file, `context` is the output of the
  # original HotpotQA retriever, not gold paragraphs.
  prefer: gold-sentence
  gold_source: /path/to/data/hotpotqa/hotpot_dev_distractor_v1.json

judge:
  script: src/answer_judge.py
  contract: v1
  base_url: http://127.0.0.1:8010/v1
  answer_model: Qwen3-4B
  max_tokens: 1000
  judge_max_tokens: 100
  shards: 32
