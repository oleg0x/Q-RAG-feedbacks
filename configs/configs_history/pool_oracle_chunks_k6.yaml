# Чанк-осознанный oracle: из тех же 100 кандидатов GTE берутся 6 чанка,
# но чанк gold-титула выбирается не по рангу, а по содержимому — вперёд идёт
# тот, в котором лежит gold-предложение (целиком > половина > нет), и только
# при равенстве решает ранг GTE.
#
# Зачем отдельно от oracle по титулам. Тот берёт лучший по рангу чанк статьи
# и тем занижает потолок: реранкер работает с чанками и мог бы взять другой
# чанк того же титула. По chunk_granularity разница видна прямо — доля
# «предложения в чанке нет» падает с 40.7% до 26.7%, если разрешить любой
# чанк статьи из пула. Эта строка и есть честная верхняя граница чанкового
# реранкера над top-100.
#
# Что это по-прежнему НЕ. Не потолок задачи: чего нет в пуле, того не
# достанет никакой выбор, а половина вторых gold-титулов в top-100 не
# доходит.
#
# Дедупликация титулов соблюдается: один чанк на статью, как в ранах,
# с которыми эта строка сравнивается.
label: oracle по чанкам, 6 чанков
slug: pool-oracle-chunks-k6

order: 77
hypothesis: >-
  Выбор чанка по содержимому, а не по рангу, поднимает потолок реранкинга
  над top-100 относительно оракула по титулам: gold-предложение часто лежит
  не в том чанке статьи, который выше в ранжировании GTE.

retrieve:
  kind: pool
  source_run: 2026-08-02-gte-pool-diag

  # Корпус и таблица смещений: row ID пула резолвятся в тексты чанков той же
  # таблицей, которой пользовался сам ретривал.
  index_dir: /home/a.anokhin/Judge/datasets/data_sources/full-wiki/wiki18-qrag-jul21-best-raw
  steps: 6

  # Отличие от pool_oracle_titles_k6.yaml. gold-предложения есть только в
  # distractor-файле: в fullwiki-файле context — это выдача исходного
  # ретривера, а не gold-абзацы.
  prefer: gold-sentence
  gold_source: /home/a.anokhin/Judge/datasets/data_sources/hotpotqa/hotpot_dev_distractor_v1.json

judge:
  script: /home/a.anokhin/Judge/Q-RAG-feedback/answer_judge_llms.py
  base_url: http://127.0.0.1:8010/v1
  answer_model: Qwen3-4B
  max_tokens: 1000
  judge_max_tokens: 100
  shards: 32
