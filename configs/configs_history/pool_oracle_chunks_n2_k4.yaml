# Chunk-aware oracle with a per-title quota of 2 chunks: the upper bound for a
# reranker allowed the same relaxed deduplication as gte_only_n2_steps{4,6}.
#
# Quota N=2 helps plain first-stage GTE (EM 29.29% vs 28.74%, F1 +0.97 pp,
# paired t = +3.04), so the chunk-reranker upper bound must be computed under
# the same rules; otherwise it is understated by exactly what the reranker can
# now do.
#
# Second chunks are taken in rounds and only if they carry gold text: first one
# chunk per found gold title, then second chunks of the same titles, and only
# then filling by GTE rank. Otherwise the budget would go to repeating an
# already covered article instead of a new title.
label: chunk oracle, 4 chunks, 2 per title
slug: pool-oracle-chunks-n2-k4

order: 79
hypothesis: >-
  If the reranker may take two chunks of one article, its upper bound is
  higher: gold sentences split by the 100-word chunk boundary become fully
  reachable.

retrieve:
  kind: pool
  source_run: 2026-08-02-gte-pool-diag
  index_dir: /path/to/data/full-wiki/wiki18-qrag-jul21-best-raw
  steps: 4

  prefer: gold-sentence
  gold_source: /path/to/data/hotpotqa/hotpot_dev_distractor_v1.json

  # The only difference from pool_oracle_chunks_k4.yaml.
  max_per_title: 2

judge:
  script: src/answer_judge.py
  contract: v1
  base_url: http://127.0.0.1:8010/v1
  answer_model: Qwen3-4B
  max_tokens: 1000
  judge_max_tokens: 100
  shards: 32
