# Чанк-осознанный oracle с квотой в два чанка на титул: верхняя граница для
# реранкера, которому разрешено то же, что и ослабленной дедупликации из
# gte_only_n2_steps{4,6}.
#
# Зачем. Квота N=2 на голом first-stage выигрывает: EM 29.29% против 28.74%,
# F1 +0.97 п.п. при парном t = +3.04. Значит верхняя граница чанкового
# реранкера должна считаться в тех же правилах, иначе она занижена ровно на
# то, что реранкер теперь умеет.
#
