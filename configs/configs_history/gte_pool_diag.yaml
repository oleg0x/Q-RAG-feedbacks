# Diagnostic retrieval: the same GTE top-100 as gte_only_steps6, but with the
# full candidate pool saved.
#
# The canonical runs use `log_candidates: none`, so their retrieval.jsonl has
# no candidate lists, and without them one cannot tell what reranking could
# reach at all. Chunk selection here matches the gte-only-steps6 run chunk for
# chunk; only the log volume differs.
#
# The judge stage is not needed and not run: answers are already measured by
# the GTE top-6 row. Run as
# `exp.py run --config configs/configs_history/gte_pool_diag.yaml --only retrieve`.
label: GTE top-6 (pool diagnostics)
slug: gte-pool-diag

# A run without metrics; it is excluded from the comparison table.
order: 900
hypothesis: >-
  Saving the GTE top-100 lets us measure the pool ceiling: how many gold
  titles it contains and how many answers an ideal selection from it yields.

retrieve:
  kind: qrag
  index_dir: /path/to/data/full-wiki/wiki18-qrag-jul21-best-raw
  candidate_index_dir: /path/to/data/full-wiki/wiki18-gte
  candidate_backend: torch-cuda
  qrag_repo: /path/to/Q-RAG-feedback
  input: /path/to/data/hotpotqa/hotpot_dev_fullwiki_v1.json
  cuda_visible_devices: "1"
  device: cuda:0
  model_dtype: float32
  state_source: critic
  batch_size: 64
  top_k: 100
  steps: 6
  mode: fixed
  reranker: none

  # The only difference from gte_only_steps6.yaml: the whole pool is saved
  # (~1.5 GB retrieval.jsonl vs 41 MB for the canonical run).
  log_candidates: full

  dedupe_titles: true
  trust_remote_code: true
  auto_prepare: false

judge:
  script: src/answer_judge.py
  contract: v1
  base_url: http://127.0.0.1:8010/v1
  answer_model: Qwen3-4B
  max_tokens: 1000
  judge_max_tokens: 100
  shards: 32
