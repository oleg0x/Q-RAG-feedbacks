# Oracle по титулам: из сохранённых 100 кандидатов GTE берутся 4 чанка,
# максимизирующих покрытие gold-титулов (тай-брейк — ранг GTE).
#
# Что это НЕ. Это не абсолютный потолок задачи и не oracle по ответу: выбор
# оптимален только по титулам, а нужное предложение внутри 100-словного чанка
# может отсутствовать. Строка отвечает ровно на один вопрос — сколько ответов
# в принципе можно вытащить идеальным реранкингом над этим пулом, и
# сравнивается с GTE top-4 на том же бюджете чанков.
#
# Дедупликация титулов соблюдается, как во всех опубликованных ранах.
