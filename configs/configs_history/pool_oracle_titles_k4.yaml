# Title oracle: from the saved 100 GTE candidates, the 4 chunks that maximise
# gold-title coverage are taken (ties broken by GTE rank).
#
# This is neither the absolute task ceiling nor an answer oracle: the selection
# is optimal only with respect to titles, and the needed sentence may be
# missing from the 100-word chunk. The row answers one question, how many
# answers ideal reranking over this pool can recover, and is compared with GTE
# top-4 at the same chunk budget.
#
# Title deduplication is kept, as in all published runs.
label: title oracle, 4 chunks
slug: pool-oracle-titles-k4

order: 74
hypothesis: >-
  An ideal selection of 4 chunks from GTE top-100 upper-bounds everything
  reranking over this pool can achieve; the gap to GTE top-4 is the cost of
  ranking, not of coverage.

retrieve:
  kind: pool
  source_run: 2026-08-02-gte-pool-diag

  # Corpus and offset table: pool row IDs are resolved to chunk texts with
  # the same table the retrieval used.
  index_dir: /path/to/data/full-wiki/wiki18-qrag-jul21-best-raw
  steps: 4

judge:
  script: src/answer_judge.py
  contract: v1
  base_url: http://127.0.0.1:8010/v1
  answer_model: Qwen3-4B
  max_tokens: 1000
  judge_max_tokens: 100
  shards: 32
