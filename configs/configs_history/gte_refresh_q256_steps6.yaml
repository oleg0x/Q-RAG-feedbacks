# Refresh baseline without a reranker: after each selected chunk GTE is queried
# again with "question [SEP] chunk1 [SEP] ...".
#
# Control run: the same scheme, but with query length 256, as in the index
# manifest and all earlier runs. The difference from q1024 at six steps is the
# cost of query truncation.
#
# This run cannot be truncated: in refresh mode the candidate pool changes
# between steps, so the 2-chunk selection is not a prefix of the 6-chunk one
# (build_eval_variants.py refuses to truncate refresh runs). Each chunk budget
# is a separate retrieval.
label: GTE refresh 256, 6 steps
slug: gte-refresh-q256-steps6

order: 44
hypothesis: >-
  Recomputing the first-stage query after each chunk raises gold-title
  coverage relative to fixed mode without any training, provided the query is
  long enough to fit the added chunks.

retrieve:
  kind: qrag
  index_dir: /path/to/data/full-wiki/wiki18-qrag-jul21-best-raw
  candidate_index_dir: /path/to/data/full-wiki/wiki18-gte
  candidate_backend: torch-cuda
  qrag_repo: /path/to/Q-RAG-feedback
  input: /path/to/data/hotpotqa/hotpot_dev_fullwiki_v1.json
  cuda_visible_devices: "3"
  device: cuda:0
  model_dtype: float32
  state_source: critic
  batch_size: 64
  top_k: 100
  steps: 6
  mode: refresh
  reranker: none
  log_candidates: none

  # First-stage query length in tokens. The corpus stays encoded with 256;
  # only the query side grows.
  first_stage_query_length: 256

  dedupe_titles: true
  trust_remote_code: true
  auto_prepare: false

judge:
  script: src/answer_judge.py
  contract: v1
  base_url: http://127.0.0.1:8010/v1
  answer_model: Qwen3-4B
  max_tokens: 1000
  judge_max_tokens: 100
  shards: 32
