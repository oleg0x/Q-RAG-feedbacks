# Reader ceiling: gold supporting sentences instead of retrieval.
#
# The context comes from the distractor file, not fullwiki: the `context` field
# of hotpot_dev_fullwiki_v1.json holds the top-10 of the original HotpotQA
# retriever rather than gold paragraphs, and 5,316 of 7,405 examples there
# contain no gold title.
#
# The oracle measures ideal retrieval over HotpotQA, not Wiki-18, so the
# "fraction of the ceiling" does not apply to it.
label: oracle (gold sentences)
slug: oracle-sf

# Row position in the results table.
order: 80
hypothesis: Reader ceiling under ideal retrieval over HotpotQA.

retrieve:
  kind: variant
  context: oracle
  source_run: 2026-07-28-gte-only-steps6
  oracle_source: /path/to/data/hotpotqa/hotpot_dev_distractor_v1.json

judge:
  script: src/answer_judge.py
  contract: v1
  base_url: http://127.0.0.1:8010/v1
  answer_model: Qwen3-4B
  max_tokens: 1000
  judge_max_tokens: 100
  shards: 32
