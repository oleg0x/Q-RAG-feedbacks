# GTE top-4 with a per-title quota of two chunks: truncation of the
# gte_only_n2_steps6 run.
#
# No separate retrieval is needed, for the same reason as for gte_only_steps4:
# in fixed mode the pool is fixed, GTE ranking does not depend on the state,
# and the per-title quota only counts already selected chunks, so the 4-step
# selection is a prefix of the 6-step one.
label: GTE top-4, 2 chunks per title
slug: gte-only-n2-steps4

order: 45
hypothesis: >-
  Allowing a second chunk from the same article recovers gold sentences locked
  out by deduplication, and this outweighs losing one title from the budget.

retrieve:
  kind: variant
  context: truncate
  steps: 4
  source_run: 2026-08-02-gte-only-n2-steps6

judge:
  script: src/answer_judge.py
  contract: v1
  base_url: http://127.0.0.1:8010/v1
  answer_model: Qwen3-4B
  max_tokens: 1000
  judge_max_tokens: 100
  shards: 32
