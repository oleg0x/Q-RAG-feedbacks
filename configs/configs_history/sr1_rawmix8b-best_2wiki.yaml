# 2WikiMultiHopQA from the Search-R1 evaluation split: tower of the raw-mix
# branch, Qwen3-8B, peak checkpoint (step ~14,000).
#
# This branch was trained on NQ + HotpotQA (169,615 examples), unlike
# Aug03_12-44-38_lineA_main, which was trained on HotpotQA + 2Wiki. Read
# against sr1_2wiki_best (that branch), sr1_2wiki_zeroshot (stock tower) and
# sr1_2wiki_noctx (reader without context) on the same questions and budget.
#
# Reader and judge are Qwen3-8B, the same model that computed the reward when
# this tower was trained. Retriever and reader were trained together and are
# measured together, so this half of the table is not directly comparable with
# the line A Search-R1 rows (Qwen3-4B reader); the 4B arm is.
#
# Eval contract v2 (the default). The em/f1/em_alias columns are computed as in
# the line A Search-R1 rows; under v2 the judge column equals the reward (the
# maximum of EM over answer variants and the judge verdict) and is not
# comparable with older rows.
label: Raw NQ+HotpotQA mix, Qwen3-8B, peak (step ~14,000)
slug: sr1-rawmix8b-best-2wiki
dataset: sr1_2wiki

order: 118
hypothesis: >-
  Training on the mix with NQ carries the gain beyond the holdout: on
  multi-hop datasets this row beats the HotpotQA+2Wiki branch, and on
  single-hop datasets it at least does not lose to it.

retrieve:
  kind: search
  index_dir: /path/to/data/full-wiki/wiki18-gte
  qrag_repo: Q-RAG_for_full-wiki
  checkpoint: Q-RAG_for_full-wiki/runs/Aug08_20-39-40_rawmix8b/model_best.pt
  state_source: critic
  input: runs/shared/searchr1/2wikimultihopqa.jsonl
  cuda_visible_devices: "1"
  device: cuda:0
  model_dtype: float32
  batch_size: 64
  top_k: 100
  steps: 6
  max_chunks_per_title: 2
  log_candidates: none
  auto_prepare: false

judge:
  base_url: http://127.0.0.1:8012/v1
  answer_model: Qwen3-8B
  max_tokens: 1000
  judge_max_tokens: 100
  shards: 32
