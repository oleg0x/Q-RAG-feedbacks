# Per-title quota ablation: the stock GTE tower with no checkpoint on
# MuSiQue-Ans dev, identical to search_zeroshot_musique.yaml except for
# max_chunks_per_title.
#
# N=2 was chosen from a measurement on stock GTE top-6 (+0.55 pp EM, McNemar
# z = +1.7) and has not been tested on the trained tower or on other datasets.
# The quota is an active knob, not a safeguard: in the saved retrieval.jsonl a
# second chunk of an already taken title is used in 99.8% of episodes, 38.5% of
# all selected chunks with a ceiling of 50%; without the quota the stock tower
# would take one article six times.
#
# N=6 with steps=6 means "no quota": the per-title chunk counter cannot reach
# six in six steps, so the mask never fires. The search subcommand has no
# separate flag (--no-dedupe-titles exists only for retrieve); repeating the
# same row is forbidden regardless of the quota (blocked_rows), so an episode
# never takes the same chunk twice.
#
# Three datasets are used for statistical power, not breadth. The expected
# effect is about 0.5 pp; on HotpotQA alone (~550 discordant pairs) McNemar
# resolves only ~0.63 pp at z = 2, while all 22,398 pairs together resolve
# about 0.35 pp. F1 and judge (paired t) are the primary metrics: in the
# original quota measurement EM gave z = +1.7 while F1 gave t = +3.04 on the
# same data.
label: Direct search, zero-shot GTE, 6 steps, no quota
slug: search-zeroshot-musique-noquota
dataset: musique_ans_dev

order: 47.2
hypothesis: >-
  Without the quota the stock tower collapses onto one or two articles: it
  currently takes a second chunk in 99.8% of episodes and hits the quota
  ceiling, so the mask is the only thing stopping it from taking six chunks of
  one article. Expected: a large drop in all answer metrics, setting the scale
  of the quota effect.

retrieve:
  kind: search
  index_dir: /path/to/data/full-wiki/wiki18-gte
  qrag_repo: Q-RAG_for_full-wiki
  input: runs/shared/musique_ans_dev_hotpot_schema.jsonl
  cuda_visible_devices: "1"
  device: cuda:0
  model_dtype: float32
  batch_size: 64
  top_k: 100
  steps: 6
  max_chunks_per_title: 6

  # none rather than full: per-candidate diagnostics are not needed for
  # this series, and the saved N=2 pools are already in the lineA-best-* runs.
  log_candidates: none
  auto_prepare: false

judge:
  script: src/answer_judge.py
  contract: v1
  base_url: http://127.0.0.1:8010/v1
  answer_model: Qwen3-4B
  max_tokens: 1000
  judge_max_tokens: 100
  shards: 32
