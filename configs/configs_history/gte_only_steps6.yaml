# First-stage GTE without Q-RAG: chunks are taken top-down by GTE rank.
#
# The baseline against which the contribution of Q-RAG is measured. In fixed
# mode it is prefix-consistent (the 2-step selection is literally a prefix of
# the 6-step one), so budgets 2 and 4 are obtained by truncating this run
# (gte_only_steps{2,4}.yaml) rather than by separate retrieval.
label: GTE top-6
slug: gte-only-steps6

# Row position in the results table.
order: 40
hypothesis: >-
  Plain first-stage GTE: the baseline against which the contribution of Q-RAG
  is measured.

retrieve:
  kind: qrag
  index_dir: /path/to/data/full-wiki/wiki18-qrag-jul21-best-raw
  candidate_index_dir: /path/to/data/full-wiki/wiki18-gte
  candidate_backend: torch-cuda
  qrag_repo: /path/to/Q-RAG-feedback
  input: /path/to/data/hotpotqa/hotpot_dev_fullwiki_v1.json
  cuda_visible_devices: "1"
  device: cuda:0
  model_dtype: float32
  state_source: critic
  batch_size: 64
  top_k: 100
  steps: 6
  mode: fixed

  # none disables Q-RAG scoring entirely: neither the state tower nor the
  # action shards are loaded.
  reranker: none
  log_candidates: none

  dedupe_titles: true
  trust_remote_code: true
  auto_prepare: false

judge:
  script: src/answer_judge.py
  contract: v1
  base_url: http://127.0.0.1:8010/v1
  answer_model: Qwen3-4B
  max_tokens: 1000
  judge_max_tokens: 100
  shards: 32
