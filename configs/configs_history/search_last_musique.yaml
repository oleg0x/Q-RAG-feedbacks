# Last checkpoint of line A on MuSiQue-Ans dev: the out-of-domain row of the
# best/last pair.
#
# See search_last_hotpotqa.yaml for the rationale. This dataset was not used in
# training, so the comparison asks a separate question: did the eval-curve peak
# (measured on 1,000 HotpotQA dev questions) fit HotpotQA so closely that last
# beats best on an unseen dataset? If so, the "best checkpoint" was selected on
# the wrong scale.
label: Direct search, last checkpoint, 6 steps, N=2
slug: lineA-last-musique
dataset: musique_ans_dev

order: 49
hypothesis: >-
  The best-last difference on MuSiQue is within noise. A consistent advantage
  of last would mean that checkpoint selection on the HotpotQA eval subset
  hurts transfer.

retrieve:
  kind: search
  index_dir: /path/to/data/full-wiki/wiki18-gte
  qrag_repo: Q-RAG_for_full-wiki
  checkpoint: Q-RAG_for_full-wiki/runs/Aug03_12-44-38_lineA_main/model_last.pt
  state_source: critic
  input: runs/shared/musique_ans_dev_hotpot_schema.jsonl
  cuda_visible_devices: "2"
  device: cuda:0
  model_dtype: float32
  batch_size: 64
  top_k: 100
  steps: 6
  max_chunks_per_title: 2
  log_candidates: full
  auto_prepare: false

judge:
  script: src/answer_judge.py
  contract: v1
  base_url: http://127.0.0.1:8010/v1
  answer_model: Qwen3-4B
  max_tokens: 1000
  judge_max_tokens: 100
  shards: 32
