# Уровень 1 ablation квоты дедупликации: обученная башня линии A
# (model_best) на полном dev HotpotQA, всё как в search_best_hotpotqa.yaml,
# отличается ровно одно поле — max_chunks_per_title.
#
# Зачем: N=2 выбрано в фазе 0 по замеру на стоковой GTE top-6 (+0.55 п.п. EM,
# McNemar z = +1.7, docs/training.md:90) и с тех пор не проверялось ни на
# обученной башне, ни на других датасетах. При этом квота — рабочая ручка, а
# не страховка: по сохранённым retrieval.jsonl второй чанк уже взятого титула
# берут 76.8% эпизодов на HotpotQA, 72.0% на 2Wiki и 76.4% на MuSiQue
# (18.8% / 17.1% / 18.1% всех взятых чанков при потолке 50%).
#
# Три датасета берутся не для широты, а для мощности. Эффект ожидается около
# 0.5 п.п.; на одном HotpotQA при ~550 дискордантных парах McNemar разрешает
# только ~0.63 п.п. на z = 2, а 22 398 пар вместе — около 0.35 п.п. Главными
# читать F1 и judge (парный t): на том же размене фазы 0 EM дал z = +1.7, а
# F1 — t = +3.04 на тех же данных.
label: Прямой поиск, обученная башня, 6 шагов, N=1
slug: lineA-best-hotpotqa-n1
dataset: hotpotqa_dev_fullwiki

order: 48.1
hypothesis: >-
  Жёсткая дедупликация не хуже квоты N=2 для обученной башни. Обоснование
  N=2 получено на стоковой GTE, а обученная башня опирается на второй чанк
  вдвое слабее (18.8% взятых чанков против 38.5%) и умеет выбирать, какой
  именно чанк статьи взять, — размен «меньше правильных статей, зато в них
  нужный текст» для неё может быть уже невыгоден.

retrieve:
  kind: search
  index_dir: /home/a.anokhin/Judge/datasets/data_sources/full-wiki/wiki18-gte
  qrag_repo: /home/a.anokhin/Judge/full-wiki/Q-RAG_for_full-wiki
  checkpoint: /home/a.anokhin/Judge/full-wiki/Q-RAG_for_full-wiki/runs/Aug03_12-44-38_lineA_main/model_best.pt
  state_source: critic
  input: /home/a.anokhin/Judge/datasets/data_sources/hotpotqa/hotpot_dev_fullwiki_v1.json
  cuda_visible_devices: "0"
  device: cuda:0
  model_dtype: float32
  batch_size: 64
  top_k: 100
  steps: 6
  max_chunks_per_title: 1

  # none, а не full: покандидатная диагностика этой серии не нужна, а
  # сохранённые пулы N=2 для неё уже лежат в ранах 2026-08-05-lineA-best-*.
  log_candidates: none
  auto_prepare: false

judge:
  script: /home/a.anokhin/Judge/Q-RAG-feedback/answer_judge_llms.py
  base_url: http://127.0.0.1:8010/v1
  answer_model: Qwen3-4B
  max_tokens: 1000
  judge_max_tokens: 100
  shards: 32
