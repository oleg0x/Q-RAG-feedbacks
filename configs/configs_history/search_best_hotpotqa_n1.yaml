# Per-title quota ablation: the trained line A tower (model_best) on the full
# HotpotQA dev set, identical to search_best_hotpotqa.yaml except for
# max_chunks_per_title.
#
# N=2 was chosen from a measurement on stock GTE top-6 (+0.55 pp EM, McNemar
# z = +1.7) and has not been tested on the trained tower or on other datasets.
# The quota is an active knob, not a safeguard: in the saved retrieval.jsonl a
# second chunk of an already taken title is used in 76.8% of episodes on
# HotpotQA, 72.0% on 2Wiki and 76.4% on MuSiQue (18.8% / 17.1% / 18.1% of all
# selected chunks, with a ceiling of 50%).
#
# Three datasets are used for statistical power, not breadth. The expected
# effect is about 0.5 pp; on HotpotQA alone (~550 discordant pairs) McNemar
# resolves only ~0.63 pp at z = 2, while all 22,398 pairs together resolve
# about 0.35 pp. F1 and judge (paired t) are the primary metrics: in the
# original quota measurement EM gave z = +1.7 while F1 gave t = +3.04 on the
# same data.
label: Direct search, trained tower, 6 steps, N=1
slug: lineA-best-hotpotqa-n1
dataset: hotpotqa_dev_fullwiki

order: 48.1
hypothesis: >-
  Strict deduplication is no worse than quota N=2 for the trained tower. N=2
  was justified on stock GTE, while the trained tower relies on second chunks
  half as much (18.8% of selected chunks vs 38.5%) and can choose which chunk
  of an article to take, so the trade-off "fewer correct articles, but with
  the needed text" may no longer pay off for it.

retrieve:
  kind: search
  index_dir: /path/to/data/full-wiki/wiki18-gte
  qrag_repo: Q-RAG_for_full-wiki
  checkpoint: Q-RAG_for_full-wiki/runs/Aug03_12-44-38_lineA_main/model_best.pt
  state_source: critic
  input: /path/to/data/hotpotqa/hotpot_dev_fullwiki_v1.json
  cuda_visible_devices: "0"
  device: cuda:0
  model_dtype: float32
  batch_size: 64
  top_k: 100
  steps: 6
  max_chunks_per_title: 1

  # none rather than full: per-candidate diagnostics are not needed for
  # this series, and the saved N=2 pools are already in the lineA-best-* runs.
  log_candidates: none
  auto_prepare: false

judge:
  script: src/answer_judge.py
  contract: v1
  base_url: http://127.0.0.1:8010/v1
  answer_model: Qwen3-4B
  max_tokens: 1000
  judge_max_tokens: 100
  shards: 32
