# NQ from the Search-R1 evaluation split: tower of the raw-mix branch,
# Qwen3-4B, peak checkpoint (step ~19,000).
#
# This branch was trained on NQ + HotpotQA (169,615 examples), unlike
# Aug03_12-44-38_lineA_main, which was trained on HotpotQA + 2Wiki. Read
# against sr1_nq_best (that branch), sr1_nq_zeroshot (stock tower) and
# sr1_nq_noctx (reader without context) on the same questions and budget.
#
# Reader and judge are Qwen3-4B, as in the line A Search-R1 rows: the
# comparison is between retrievers, so the reader must be the same. The 8B
# arm's training reward was computed with Qwen3-8B, but that does not matter at
# evaluation time: the tower is evaluated, not the model that trained it.
#
# Eval contract v2 (the default). The em/f1/em_alias columns are computed as in
# the line A Search-R1 rows; under v2 the judge column equals the reward (the
# maximum of EM over answer variants and the judge verdict) and is not
# comparable with older rows.
label: Raw NQ+HotpotQA mix, Qwen3-4B, peak (step ~19,000)
slug: sr1-rawmix4b-best-nq
dataset: sr1_nq

order: 100
hypothesis: >-
  Training on the mix with NQ carries the gain beyond the holdout: on
  multi-hop datasets this row beats the HotpotQA+2Wiki branch, and on
  single-hop datasets it at least does not lose to it.

retrieve:
  kind: search
  index_dir: /path/to/data/full-wiki/wiki18-gte
  qrag_repo: Q-RAG_for_full-wiki
  checkpoint: Q-RAG_for_full-wiki/runs/Aug08_20-39-33_rawmix4b/model_best.pt
  state_source: critic
  input: runs/shared/searchr1/nq.jsonl
  cuda_visible_devices: "0"
  device: cuda:0
  model_dtype: float32
  batch_size: 64
  top_k: 100
  steps: 6
  max_chunks_per_title: 2
  log_candidates: none
  auto_prepare: false

judge:
  base_url: http://127.0.0.1:8010/v1
  answer_model: Qwen3-4B
  max_tokens: 1000
  judge_max_tokens: 100
  shards: 32
