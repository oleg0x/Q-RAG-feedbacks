# TriviaQA from the Search-R1 evaluation split: the trained line A tower.
#
# Single-hop; out-of-domain for both. On average 14 acceptable answers per
# question and 88% of questions have several, so only alias EM should be read
# here.
#
# The retrieval configuration is exactly the one behind the 37.70/30.31/10.14
# EM on our own dev splits: six steps, quota N=2, six chunks to the reader. One
# model and one setting for all seven datasets; tuning the budget per dataset
# would mean tuning on eval.
#
# Read only together with its two neighbours on the same questions:
# sr1_triviaqa_zeroshot (the same tower without a checkpoint) and
# sr1_triviaqa_noctx (the reader with no context). Without the first, the
# effect of training is unknown; without the second, so is how much Qwen3-4B
# answers from memory.
#
# This input has no gold titles, so title metrics and the fraction of the
# ceiling stay null. The main number is alias EM: Search-R1 computes EM as the
# maximum over all golden_answers.
label: Direct search, trained tower, 6 steps, N=2
slug: sr1-best-triviaqa
dataset: sr1_triviaqa

order: 48
hypothesis: >-
  The trained line A state tower on TriviaQA (11313 questions) beats both its
  zero-shot and the no-context reader; the result is placed next to
  Search-R1-base-7B on the same Wiki-18 corpus and the same questions.

retrieve:
  kind: search
  index_dir: /path/to/data/full-wiki/wiki18-gte
  qrag_repo: Q-RAG_for_full-wiki
  checkpoint: Q-RAG_for_full-wiki/runs/Aug03_12-44-38_lineA_main/model_best.pt
  state_source: critic
  input: runs/shared/searchr1/triviaqa.jsonl
  cuda_visible_devices: "0"
  device: cuda:0
  model_dtype: float32
  batch_size: 64
  top_k: 100
  steps: 6
  max_chunks_per_title: 2
  log_candidates: none
  auto_prepare: false

judge:
  script: src/answer_judge.py
  contract: v1
  base_url: http://127.0.0.1:8010/v1
  answer_model: Qwen3-4B
  max_tokens: 1000
  judge_max_tokens: 100
  shards: 32
