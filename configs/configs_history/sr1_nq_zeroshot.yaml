# NQ from the Search-R1 evaluation split: the stock GTE tower with no
# checkpoint.
#
# In-house baseline for sr1_nq_best on the same questions and chunk budget. A
# row without a baseline at the same budget proves nothing: without it, "X for
# us vs Y for Search-R1" does not say whether training helped at all.
#
# The tower is stock, so the first step exactly reproduces GTE ranking; after
# that the query grows with the retrieved chunks.
label: Direct search, zero-shot GTE, 6 steps, N=2
slug: sr1-zeroshot-nq
dataset: sr1_nq

order: 47
hypothesis: >-
  Iterative direct search with the stock GTE tower sets the starting point on
  NQ; the gap to sr1-best-nq is the contribution of training.

retrieve:
  kind: search
  index_dir: /path/to/data/full-wiki/wiki18-gte
  qrag_repo: Q-RAG_for_full-wiki
  input: runs/shared/searchr1/nq.jsonl
  cuda_visible_devices: "0"
  device: cuda:0
  model_dtype: float32
  batch_size: 64
  top_k: 100
  steps: 6
  max_chunks_per_title: 2
  log_candidates: none
  auto_prepare: false

judge:
  script: src/answer_judge.py
  contract: v1
  base_url: http://127.0.0.1:8010/v1
  answer_model: Qwen3-4B
  max_tokens: 1000
  judge_max_tokens: 100
  shards: 32
