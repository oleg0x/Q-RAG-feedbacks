# TriviaQA from the Search-R1 evaluation split: the reader with no context at
# all.
#
# The lower bound of the scale and the only way to interpret the single-hop
# numbers. Search-R1's Direct Inference row (Qwen2.5-7B, no retrieval) scores
# .408 on TriviaQA against their final .638, so much of that number reflects
# model knowledge rather than search. Without this row our TriviaQA, PopQA and
# NQ results cannot be interpreted.
#
# Derived from sr1-best-triviaqa: the same questions in the same order, with
# pred_texts cleared. No retrieval and no GPU are needed, so it must run after
# sr1_triviaqa_best.
label: no retrieval
slug: sr1-noctx-triviaqa
dataset: sr1_triviaqa

order: 10
hypothesis: >-
  How well Qwen3-4B answers TriviaQA with no context at all: the lower bound
  against which both search rows are read.

retrieve:
  kind: variant
  context: none
  source_run: 2026-08-07-sr1-best-triviaqa

judge:
  script: src/answer_judge.py
  contract: v1
  base_url: http://127.0.0.1:8010/v1
  answer_model: Qwen3-4B
  max_tokens: 1000
  judge_max_tokens: 100
  shards: 32
