# Q-RAG reranking over GTE top-100, budget of six chunks.
#
# Reproduces the canonical qrag-fixed-steps6 run. Copy this file as a template
# for new Q-RAG experiments: usually only steps, index_dir (another checkpoint)
# and hypothesis need to change.
label: "Q-RAG, 6 steps"
slug: qrag-fixed-steps6

# Row position in the results table.
order: 70
hypothesis: >-
  A trained Q-RAG reranker over GTE top-100 improves answer metrics over plain
  first-stage retrieval.

retrieve:
  kind: qrag
  index_dir: /path/to/data/full-wiki/wiki18-qrag-jul21-best-raw
  candidate_index_dir: /path/to/data/full-wiki/wiki18-gte
  candidate_backend: torch-cuda
  qrag_repo: /path/to/Q-RAG-feedback
  input: /path/to/data/hotpotqa/hotpot_dev_fullwiki_v1.json

  # The physical GPU is selected via CUDA_VISIBLE_DEVICES; inside the
  # process it is always cuda:0. Check free memory (nvidia-smi) before launch.
  cuda_visible_devices: "1"
  device: cuda:0

  model_dtype: float32
  state_source: critic
  batch_size: 64
  top_k: 100
  steps: 6
  mode: fixed
  reranker: qrag

  # full reproduces the published runs byte for byte but inflates files:
  # answer_judge copies all input fields, and steps=6 yields 467 MB.
  # For new experiments that do not need the candidate dump, use none.
  log_candidates: full

  dedupe_titles: true
  trust_remote_code: true
  auto_prepare: false

judge:
  script: src/answer_judge.py
  contract: v1
  base_url: http://127.0.0.1:8010/v1
  answer_model: Qwen3-4B
  max_tokens: 1000
  judge_max_tokens: 100
  shards: 32
