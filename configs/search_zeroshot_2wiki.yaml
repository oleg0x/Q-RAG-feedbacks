# Стартовая точка линии A на 2WikiMultiHopQA: стоковая GTE-башня без чекпоинта.
#
# Без этой строки цифра обученной башни на 2Wiki не утверждает ничего: в
# реестре нет ни одного рана на этом датасете, сравнивать не с чем. Ран
# отличается от search_best_2wiki.yaml ровно отсутствием checkpoint, поэтому
# разница двух строк — это вклад обучения и ничего больше.
#
# Потолок покрытия корпуса здесь 51.05% против 81.67% у HotpotQA
# (runs/shared/2wiki_dev_title_coverage.json): половина gold-статей 2Wiki в
# Wiki-18 просто отсутствует. Абсолютный EM поэтому будет низким у обеих
# строк, и читать его нужно как долю потолка, а не как число рядом с HotpotQA.
label: Прямой поиск, zero-shot GTE, 6 шагов, N=2
slug: search-zeroshot-2wiki
dataset: 2wiki_dev

order: 47
hypothesis: >-
  Итеративный прямой поиск стоковой GTE-башней задаёт стартовую точку на
  2Wiki. Ожидание — заметно ниже HotpotQA по абсолютному EM из-за вдвое
  меньшего покрытия корпуса, но сопоставимо по доле потолка.

