# Starting point of line A on 2WikiMultiHopQA: the stock GTE tower with no
# checkpoint.
#
# Without this row the trained number on 2Wiki has nothing to be compared with.
# The run differs from search_best_2wiki.yaml only by the missing checkpoint,
# so the gap between the two rows is the contribution of training and nothing
# else.
#
# The corpus coverage ceiling here is 51.05% vs 81.67% for HotpotQA
# (runs/shared/2wiki_dev_title_coverage.json): half of the 2Wiki gold articles
# are missing from Wiki-18. Absolute EM is therefore low for both rows; read it
# as a fraction of the ceiling, not next to HotpotQA.
label: Direct search, zero-shot GTE, 6 steps, N=2
slug: search-zeroshot-2wiki
dataset: 2wiki_dev

order: 47
hypothesis: >-
  Iterative direct search with the stock GTE tower sets the starting point on
  2Wiki. Expected: clearly below HotpotQA in absolute EM because corpus
  coverage is half as large, but comparable as a fraction of the ceiling.

retrieve:
  kind: search
  index_dir: /path/to/data/full-wiki/wiki18-gte
  qrag_repo: Q-RAG_for_full-wiki
  input: /path/to/data/2WikiMultiHopQA/data_ids_april7/dev.json
  cuda_visible_devices: "6"
  device: cuda:0
  model_dtype: float32
  batch_size: 64
  top_k: 100
  steps: 6
  max_chunks_per_title: 2
  log_candidates: full
  auto_prepare: false

judge:
  script: src/answer_judge.py
  contract: v1
  base_url: http://127.0.0.1:8010/v1
  answer_model: Qwen3-4B
  max_tokens: 1000
  judge_max_tokens: 100
  shards: 32
