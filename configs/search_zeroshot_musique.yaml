# Starting point of line A on MuSiQue-Ans: the stock GTE tower with no
# checkpoint.
#
# The input is the output of build_musique_eval.py, not the raw dataset file:
# MuSiQue has a flat paragraphs list instead of context/supporting_facts, and
# without conversion the pipeline would silently run with empty gold titles and
# title EM = 100% (see the converter docstring).
#
# The corpus coverage ceiling is 72.11%
# (runs/shared/musique_ans_dev_title_coverage.json), between HotpotQA (81.67%)
# and 2Wiki (51.05%).
label: Direct search, zero-shot GTE, 6 steps, N=2
slug: search-zeroshot-musique
dataset: musique_ans_dev

order: 47
hypothesis: >-
  Iterative direct search with the stock GTE tower sets the starting point on
  MuSiQue. Expected: below HotpotQA, since a third of the questions need three
  or more hops and MuSiQue questions are built so that they cannot be solved
  in a single hop.

retrieve:
  kind: search
  index_dir: /path/to/data/full-wiki/wiki18-gte
  qrag_repo: Q-RAG_for_full-wiki
  input: runs/shared/musique_ans_dev_hotpot_schema.jsonl
  cuda_visible_devices: "6"
  device: cuda:0
  model_dtype: float32
  batch_size: 64
  top_k: 100
  steps: 6
  max_chunks_per_title: 2
  log_candidates: full
  auto_prepare: false

judge:
  script: src/answer_judge.py
  contract: v1
  base_url: http://127.0.0.1:8010/v1
  answer_model: Qwen3-4B
  max_tokens: 1000
  judge_max_tokens: 100
  shards: 32
