# Zero-shot direct search on the full HotpotQA dev set. The tower is the stock
# GTE with no checkpoint, so the first step exactly reproduces GTE ranking;
# after that the query grows with the retrieved chunks. This is the starting
# point needed to read the trained number.
#
# Compare with gte-only-n2-steps6 (29.29% EM): both use quota N=2 and a
# six-chunk budget and differ only in query iteration.
label: Direct search, zero-shot GTE, 6 steps, N=2
slug: search-zeroshot-steps6

order: 47
hypothesis: >-
  Iterative direct search with the stock GTE tower (query = state) and quota
  N=2 sets the starting point of line A. Expected: close to GTE top-6 N=2,
  since iteration without training can both help (the second hop becomes
  visible in the query) and hurt (the question is diluted by retrieved text,
  as with refresh).

retrieve:
  kind: search
  index_dir: /path/to/data/full-wiki/wiki18-gte
  qrag_repo: Q-RAG_for_full-wiki
  input: /path/to/data/hotpotqa/hotpot_dev_fullwiki_v1.json
  cuda_visible_devices: "1"
  device: cuda:0
  model_dtype: float32
  batch_size: 64
  top_k: 100
  steps: 6
  max_chunks_per_title: 2
  log_candidates: none
  auto_prepare: false

judge:
  script: src/answer_judge.py
  contract: v1
  base_url: http://127.0.0.1:8010/v1
  answer_model: Qwen3-4B
  max_tokens: 1000
  judge_max_tokens: 100
  shards: 32
