# Trained state tower of line A on the full HotpotQA dev set.
#
# Read against two rows on the same dataset: zero-shot direct search with the
# same tower (27.16% EM) separates the contribution of training from that of
# the direct-search scheme itself, and GTE top-6 N=2 (29.29%) is the strongest
# first stage at the same chunk budget. Both pairs are compared with a paired
# McNemar test.
#
# Checkpoint: model_best.pt of run Aug03_12-44-38_lineA_main, i.e. optim_step
# 12,000 of 30,000, selected by the judge metric under a rule fixed before
# training. On the 1,000-question eval subset it scores 0.499 vs 0.483 for
# model_last, but from step ~7,000 the curve stays on a plateau of
# 0.484 ± 0.005, so the peak is about one sigma above the plateau and the two
# checkpoints are expected to be indistinguishable.
label: Direct search, trained tower, 6 steps, N=2
slug: lineA-best-hotpotqa
dataset: hotpotqa_dev_fullwiki

order: 48
hypothesis: >-
  Training direct search (PQN with a calibration head, 30,000 steps on
  HotpotQA+2Wiki train) lifts answer metrics on the full HotpotQA dev set
  above zero-shot (27.16% EM) and above first-stage GTE top-6 N=2 (29.29%) at
  the same six-chunk budget.

retrieve:
  kind: search
  index_dir: /path/to/data/full-wiki/wiki18-gte
  qrag_repo: Q-RAG_for_full-wiki
  checkpoint: Q-RAG_for_full-wiki/runs/Aug03_12-44-38_lineA_main/model_best.pt
  state_source: critic
  input: /path/to/data/hotpotqa/hotpot_dev_fullwiki_v1.json
  cuda_visible_devices: "6"
  device: cuda:0
  model_dtype: float32
  batch_size: 64
  top_k: 100
  steps: 6
  max_chunks_per_title: 2

  # full rather than none: the trained tower's candidate pool must be
  # comparable with the stock tower's on the same questions. Pool drift during
  # training (gold title recall 0.59 → 0.41) was measured only by telemetry on
  # 1,000 questions; candidate_pool.py report computes it on the full dev set,
  # but only if the candidates are saved.
  log_candidates: full
  auto_prepare: false

judge:
  script: src/answer_judge.py
  contract: v1
  base_url: http://127.0.0.1:8010/v1
  answer_model: Qwen3-4B
  max_tokens: 1000
  judge_max_tokens: 100
  shards: 32
