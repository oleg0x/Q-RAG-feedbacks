# NQ + HotpotQA raw mix, the same one Search-R1 is trained on.
# Differs from fullwiki_search.yaml only in data: action set, masks, horizon and
# exploration are the same; the episode sample and its labels change.
#
# Training on HotpotQA + 2Wiki gave no gain on single-hop benchmarks (on NQ the
# sign is negative, 34.4 → 33.4). The mix tests the hypothesis that the model
# learned multi-hop behaviour rather than search as such.
task: NQ+HotPotQA

max_steps: 6
top_k: 100
max_chunks_per_title: 2
separator: " [SEP] "
feedback_workers: ${envs_parallel}

rollout_train_mode: false

positions_processor: none
positions_processor_dict:
  none:
    _target_: envs.text_env.AbsolutePositionProcessor

exploration:
  epsilon: 0.1
  injection_sampling: boltzmann
  temperature:
    kind: linear
    start: 1.0
    final: 0.3
    warmup: 0
    total: ${steps_count}

index:
  shard_dir: /path/to/data/full-wiki/wiki18-gte/embedding-shards
  rows: 21015324
  dim: 768

title_table: /path/to/data/full-wiki/wiki18-gte/corpus-title-ids.npy
corpus: /path/to/data/full-wiki/data00/jiajie_jin/flashrag_indexes/wiki_dpr_100w/wiki_dump.jsonl
offsets: /path/to/data/full-wiki/wiki18-gte/corpus-row-offsets.npy

# The whole raw parquet, without filtering or deduplication against eval
# (checked: there is no overlap). Built by src/build_train_mix.py.
train_data_path: ../train_data
train_dataset:
  _target_: envs.RetrievalNqHotpotqa
  path: ${envs.train_data_path}/raw
  split: train
  seed: ${seed}

# Episode weights: 1 everywhere, 0 on the holdout. This file handles both the
# holdout exclusion and filtered variants: with the same seed they differ only
# by this file, so the example sequence stays comparable.
train_weights: ${envs.train_data_path}/weights/a1.jsonl

# Validation: the same holdout, 1000 examples from each half of the mix, with
# separate curves. With eval on HotpotQA alone while training on the mix, a
# plateau would only mean that one half stopped improving, not training.
eval_dataset:
  _target_: envs.RetrievalNqHotpotqa
  path: ${envs.train_data_path}/raw
  split: train
  ids_file: ${envs.train_data_path}/holdout.json
  length: ${eval_episodes}
  seed: ${seed}
