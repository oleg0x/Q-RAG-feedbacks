# Line A: direct search over all 21,015,324 Wiki-18 chunks.
# The action set comes from the search s @ M.T, not from the dataset, so the
# candidate fields of the q0_s1 file (candidates/judgements/betas/context) are
# ignored; only question, answer and supporting_facts are used.
task: HotPotQA+2WikiMultihopQA

# Six transitions per reader call instead of two: the line A horizon.
max_steps: 6
# K: size of the pool returned by search. Raises the ceiling from 36.15% to ~47%.
top_k: 100
# N: per-title chunk quota. Measured: +0.55 pp for GTE, +0.35 for the oracle.
max_chunks_per_title: 2
separator: " [SEP] "
# The reader and judge are blocking HTTP calls; one thread per environment.
feedback_workers: ${envs_parallel}

# Transitions are collected in eval mode: dropout in the state tower breaks the
# search/value identity during collection. Measured on stock weights, the
# cosine between the trained tower's query and stock GTE is 1.0 in eval and
# 0.95 in train mode, so the step-0 pool is no longer the GTE pool. The eval
# path (src/fullwiki_qrag.py search) also has different noise, and train/eval
# shift is exactly what failed in the reranker setting. The gradient step still
# runs in train mode, so dropout still regularizes training.
rollout_train_mode: false

# RoPE rotation of actions is disabled: actions are raw rows of M. The value
# `none` selects EmbedderNone in algo.action_embed_dict, so the search/value
# identity holds at every step, not only the first.
positions_processor: none
positions_processor_dict:
  none:
    _target_: envs.text_env.AbsolutePositionProcessor

exploration:
  # Share of steps where the action is taken from the GTE top-K of the current
  # state. Without injection the model cannot go beyond its own ranking.
  epsilon: 0.1
  # How the action is chosen within the GTE top-100. `boltzmann` uses the same
  # rule as the own pool (GTE preference at the same temperature), `uniform`
  # samples uniformly from the hundred.
  injection_sampling: boltzmann
  # The temperature is dimensionless: logits are divided by their spread over
  # the pool.
  temperature:
    kind: linear
    start: 1.0
    final: 0.3
    warmup: 0
    total: ${steps_count}

index:
  shard_dir: /path/to/data/full-wiki/wiki18-gte/embedding-shards
  rows: 21015324
  dim: 768

# Built by src/build_title_table.py; not stored in git.
title_table: /path/to/data/full-wiki/wiki18-gte/corpus-title-ids.npy
corpus: /path/to/data/full-wiki/data00/jiajie_jin/flashrag_indexes/wiki_dpr_100w/wiki_dump.jsonl
# Built by `python src/fullwiki_qrag.py prepare`.
offsets: /path/to/data/full-wiki/wiki18-gte/corpus-row-offsets.npy

train_data_path: /path/to/data/hotpotqa_2wiki_candidate_train_q0_s1.jsonl
train_dataset:
  _target_: envs.CombinedCandidateDataset
  path: ${envs.train_data_path}
  split: train
  seed: ${seed}

# Validation: a subset of HotpotQA fullwiki dev. The resulting leak into the
# final table is accepted deliberately; to compensate, numbers are also
# reported for model_last.
eval_data_path: /path/to/data/hotpotqa
eval_dataset:
  _target_: envs.RetrievalHotPotQA
  path: ${envs.eval_data_path}
  split: fullwiki_eval
  length: ${eval_episodes}
  seed: ${seed}
