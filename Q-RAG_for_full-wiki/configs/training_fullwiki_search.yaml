# Линия A из docs/training.md: Q-RAG как итеративный плотный ретривер.
# Запускается train_q_rag_search.py, а не train_q_rag.py: сборка объектов
# другая — матрица M на GPU, таблица титулов, чтение корпуса, батчевый rollout.
defaults:
  - algo: pqn_gte
  - envs: fullwiki_search
  - feedback: llm
  - logger: logging
  - _self_

seed: 42
device: cuda:0
# 30 000 оптимизационных шагов: задача труднее прежней на порядки.
steps_count: 30000
# 24 × 4 = 96 переходов на оптимизационный шаг. Не 96 × 1: градиентный
# проход кодирует все состояния батча разом, и при 96 состояниях активации
# (~65 ГиБ) поверх 60 ГиБ матрицы не помещаются в 140 ГиБ — смок падал OOM
# ровно на первом update. Дробление батча снижает пик памяти вчетверо, не
# меняя ни эффективный батч, ни число оптимизационных шагов.
batch_size: 24
accumulate_grads: 4
eval_interval: 500
eval_episodes: 1000
# Поиск упирается в чтение 60 ГиБ, один запрос стоит как шестнадцать.
envs_parallel: 16
max_action_length: 256
max_action_length_in_memory: 256
# Action-башня заморожена и обязана оставаться побитово равной стоковой GTE:
# векторы действий берутся прямо из шардов wiki18-gte.
train_action_embed: false
# Случайной фазы у линии A нет: равномерный выбор из 21 млн строк — шум.
learning_start: 0

feedback:
  type: llm

algo:
  pqn:
    # normalize=false у обеих state-башен: на ранжирование это не влияет
    # (‖s‖ один и тот же для всех кандидатов состояния), зато Q перестаёт
    # упираться в потолок 1.0. Action-сторона нормирована — так собран индекс.
    state_embed:
      normalize: false
    state_embed_target:
      normalize: false
    hyperparams:
      # Пул политики равен пулу поиска: V считается по тем же ста кандидатам,
      # из которых выбирается действие.
      top_k_actions: ${envs.top_k}
      # Калибровочная голова Q = w·(s·M[a]) + b. Без неё логиты ±20 при
      # таргетах [0,1], и на переобучении 100 примеров MSE разворачивал
      # башню в анти-корреляцию со стартом (косинус −0.25, recall пула 0).
      # scale_init = 1/‖s₀‖ при ‖s₀‖ ≈ 20.8; lr головы быстрый, чтобы
      # рассогласование масштаба чинил скаляр, а не веса башни.
      q_head:
        scale_init: 0.048
        lr: 1e-3
      # Явное расписание вместо alpha ∝ lr. Прежняя связь давала почти
      # нулевую температуру во время warmup и рост к середине рана.
      alpha_schedule:
        kind: constant
        start: ${algo.pqn.hyperparams.alpha}
  optimizer:
    lr: 5e-6
  scheduler:
    total: ${steps_count}
    warmup: 1000
    ratio: 0.1
