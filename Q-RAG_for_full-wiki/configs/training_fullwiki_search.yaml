# Line A (see README.md): Q-RAG as an iterative dense retriever.
# Run with train_q_rag_search.py, not train_q_rag.py: objects are assembled
# differently (matrix M on GPU, title table, corpus reads, batched rollout).
defaults:
  - algo: pqn_gte
  - envs: fullwiki_search
  - feedback: llm
  - logger: logging
  - _self_

seed: 42
device: cuda:0
# 30,000 optimizer steps: the task is orders of magnitude harder than the
# distractor setting.
steps_count: 30000
# 24 × 4 = 96 transitions per optimizer step. Not 96 × 1: the gradient pass
# encodes all batch states at once, and with 96 states the activations
# (~65 GiB) on top of the 60 GiB matrix do not fit in 140 GiB (OOM on the first
# update). Splitting the batch cuts peak memory fourfold without changing the
# effective batch or the number of optimizer steps.
batch_size: 24
accumulate_grads: 4
eval_interval: 500
eval_episodes: 1000
# Search is bound by reading 60 GiB: sixteen queries cost about as much as one.
envs_parallel: 16
max_action_length: 256
max_action_length_in_memory: 256
# The action tower is frozen and must stay bit-identical to stock GTE:
# action vectors are taken directly from the wiki18-gte shards.
train_action_embed: false
# Line A has no random phase: a uniform choice among 21M rows is noise.
learning_start: 0

feedback:
  type: llm

algo:
  pqn:
    # normalize=false for both state towers: ranking is unaffected (‖s‖ is
    # the same for all candidates of a state), but Q is no longer capped at
    # 1.0. The action side is normalized, as that is how the index was built.
    state_embed:
      normalize: false
    state_embed_target:
      normalize: false
    hyperparams:
      # The policy pool equals the search pool: V is computed over the same
      # hundred candidates the action is chosen from.
      top_k_actions: ${envs.top_k}
      # Calibration head Q = w·(s·M[a]) + b. Without it logits are ±20 against
      # [0,1] targets, and when overfitting 100 examples the MSE turned the
      # tower anti-correlated with its start (cosine −0.25, pool recall 0).
      # scale_init = 1/‖s₀‖ with ‖s₀‖ ≈ 20.8; the head lr is high so that the
      # scale mismatch is fixed by the scalar rather than the tower weights.
      q_head:
        scale_init: 0.048
        lr: 1e-3
      # Explicit schedule instead of alpha ∝ lr. That coupling gave a near-zero
      # temperature during warmup and a rise toward mid-run.
      alpha_schedule:
        kind: constant
        start: ${algo.pqn.hyperparams.alpha}
  optimizer:
    lr: 5e-6
  scheduler:
    total: ${steps_count}
    warmup: 1000
    ratio: 0.1
