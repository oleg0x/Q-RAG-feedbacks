# Line A on the NQ + HotpotQA raw mix.
# Everything except data and eval repeats training_fullwiki_search.yaml: the two
# variants (Qwen3-4B and Qwen3-8B as reader and judge) must match in everything
# except the reward model and differ only in the environment variables
# VLLM_MODEL / VLLM_BASE_URL.
defaults:
  - algo: pqn_gte
  - envs: fullwiki_rawmix
  - feedback: llm
  - logger: logging
  - _self_

seed: 42
device: cuda:0
steps_count: 30000
batch_size: 24
accumulate_grads: 4
eval_interval: 500
# The whole holdout: 1000 examples from each half of the mix.
eval_episodes: 2000
envs_parallel: 16
max_action_length: 256
max_action_length_in_memory: 256
train_action_embed: false
learning_start: 0

feedback:
  type: llm

algo:
  pqn:
    state_embed:
      normalize: false
    state_embed_target:
      normalize: false
    hyperparams:
      top_k_actions: ${envs.top_k}
      q_head:
        scale_init: 0.048
        lr: 1e-3
      alpha_schedule:
        kind: constant
        start: ${algo.pqn.hyperparams.alpha}
  optimizer:
    lr: 5e-6
  scheduler:
    total: ${steps_count}
    warmup: 1000
    ratio: 0.1
